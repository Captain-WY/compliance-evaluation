    name: "证券公司和证券投资基金管理公司合规管理办法"
    url: "https://www.csrc.gov.cn/csrc/c101838/c1021974/content.shtml"
    used_for:
      - "compliance management roles"
      - "compliance responsibility and supervision concepts"

principles:
  - "Use real organization names only when they are available from official public disclosures."
  - "Use user-supplied branch company and branch-office names as authoritative project seed input."
  - "Use synthetic users, names, passwords, and demo accounts."
  - "Stable IDs are preferred over display labels for backend modeling."
  - "Do not invent branch-office names outside the user-supplied list."
  - "Mock addresses and internal codes are allowed when names and city/area attribution are preserved."
  - "This file is a seed design draft, not a committed database fixture."

