branch_office_seed_policy:
  current_policy: "user_supplied_partial_names_plus_mock_metadata"
  reason: "User supplied partial branch-office names are authoritative for the project; missing addresses, internal codes and some parent assignments are mocked or inferred."
  slot_id_pattern: "WLZQ-BO-{REGION_CODE}-{000}"
  p0_runtime_normalization:
    branch_business_line_default:
      value: ["BL-WEALTH"]
      source_marker: "inferred_default_p0"
      reason: "P0 inspection and data-scope paths need a non-empty business-line dimension; final line attribution must come from OA/HR or confirmed seed data."
    parent_confidence:
      explicit_city: "high"
      inferred_city: "medium"
      inferred_or_fallback: "low"
      reason: "Parent assignments inferred from partial branch-office data must remain visible to avoid treating seed jurisdiction as confirmed fact."
  required_fields_when_full_names_are_available:
    - "org_id"
    - "org_name"
    - "parent_branch_company_org_id"
    - "region"
    - "city"
    - "registered_address"
    - "business_line_ids"
    - "data_origin"
  suggested_generation_for_dev_only:
    allowed: true
    scope: "metadata_only"
    note: "Mock codes and addresses are allowed; do not generate additional branch-office names outside the user-supplied list unless explicitly approved."

review_chain_models:
  - chain_id: "RC-WLZQ-BRANCH-TO-COMPLIANCE-DIRECTOR"
    label: "营业部-分公司-条线总部-合规部-合规总监多级复核"
    applies_to: ["inspection_issue_confirmation", "rectification_feedback", "major_risk_issue"]
