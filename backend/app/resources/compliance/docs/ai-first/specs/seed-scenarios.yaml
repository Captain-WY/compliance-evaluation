reset_strategy:
  local_dev: "Recreate all SEED001 records by stable IDs; never mix with production data."
  e2e: "Reset before each suite or use test transaction rollback."
  staging: "Allow manual reset only for synthetic tenant/workspace."
  production: "never_reset"
  runtime_command: ".venv\\Scripts\\python scripts\\seed_runtime.py"
  dry_run_command: ".venv\\Scripts\\python scripts\\seed_runtime.py --dry-run"
  postgresql_reset: "TRUNCATE seed-owned P0 tables RESTART IDENTITY CASCADE before insert."
  sqlite_fallback_reset: "Clear seed-owned P0 tables in dependency order; fallback is developer-only until SQLite migration compatibility is separately audited."
  relative_date_policy: "Smoke-sensitive normal deadlines are generated relative to P0_SEED_BASE_DATE or the seed run date; explicit overdue scenarios use negative offsets."

conversion_notes:
  - "Branch companies can be converted into real seed rows now because official names and addresses are disclosed."
  - "Branch-office rows should remain count-based slots until full official names are retrieved."
  - "The multi-level review chain is a workflow model; it should not force every organization into a strict tree if actual matrix management differs."
  - "Passwords, API keys, and real employee identities must never be stored in this seed file."
