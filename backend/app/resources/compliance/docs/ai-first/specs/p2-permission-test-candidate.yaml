    data_scope: "own_user"
  - id: "PERM-P2-NOTIFICATION-MARK-READ"
    resource: "NOTIFICATION"
    actions: ["mark_own_read", "mark_all_own_read"]
    roles: ["any_authenticated_user"]
    data_scope: "own_user"
  - id: "PERM-P2-ISSUE-PROJECT-TRACKER-READ"
    resource: "ISSUE_PROJECT_TRACKER"
