personas:
  - id: "persona_all_authenticated_user"
    data_scope: "own_user"
    p2_access:
      - "notification read own recipient state"
      - "task count for own task scope"
  - id: "persona_hq_compliance_manager"
    roles: ["ROLE_COMPLIANCE_MANAGER"]
    data_scope: "all"
    p2_access:
      - "issue project tracker"
      - "issue analytics/export"
      - "workflow designer candidate"
      - "assessment scheduler/simulation/data cockpit candidate"
      - "unified review workbench if assigned or all-scope is approved"
  - id: "persona_compliance_director"
    roles: ["ROLE_COMPLIANCE_DIRECTOR"]
    data_scope: "all"
    p2_access:
      - "final review/workflow approval policy candidate"
      - "analytics/export"
  - id: "persona_hq_reviewer"
    roles: ["ROLE_INSPECTION_LEAD", "ROLE_COMPLIANCE_MANAGER"]
    data_scope: "assigned_or_project"
    p2_access:
      - "unified review workbench assigned tasks"
      - "task/notification read"
  - id: "persona_branch_actor"
    roles: ["ROLE_BRANCH_MANAGER", "ROLE_BRANCH_COMPLIANCE_OFFICER"]
    data_scope: "organization"
    p2_access:
      - "own notifications"
      - "own branch task counts"
      - "no HQ issue analytics/export unless separately approved"

