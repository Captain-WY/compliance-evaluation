denial_requirements:
  - "A branch actor cannot read HQ issue analytics/export surfaces unless a future explicit branch view is frozen."
  - "Notification APIs can only mutate the current actor's recipient state."
  - "Review workbench decisions require assigned_or_project scope even if menu access is visible."
  - "Data sync overwrite rerun requires a high-risk audit event and cannot be exposed to branch actors."
  - "Server export endpoints must not leak Authorization headers, credentials, or source payload secrets in artifacts. First-batch Issue Analytics client export has no server artifact after P2-EXPORT-001=B."

acceptance_scenarios:
  - id: "AC-P2-NOTIF-001"
    slice: "P2-NOTIF-05"
    name: "Notification center uses durable per-recipient read state"
    assertions:
      - "Authenticated user lists only notifications addressed to them or their role/scope."
      - "Unread count decreases after mark-read and mark-all-read."
      - "Mark-read creates audit/read receipt and does not mark any UnifiedTask done."
      - "Notification center route is either authorized and reachable or visibly disabled by design."
  - id: "AC-P2-TASK-COUNT-001"
    slice: "P2-NOTIF-05"
    name: "Task counts reflect real task mutations without mock fallback"
    assertions:
      - "Counts are computed from real UnifiedTask rows and actor scope."
      - "Creating P0/P1/P2 task-generating events changes count after refetch."
      - "Read/open navigation does not change done/open counts."
  - id: "AC-P2-ISSUE-PROJECT-001"
    slice: "P2-ISSUE-06"
    name: "Issue project tracker is a scoped read model with reminder command"
    assertions:
      - "Project and branch progress totals match underlying issues/rectifications."
      - "Filters change backend query results and pagination metadata."
      - "Overdue reminder records a reminder event and uses notification/task delivery semantics after P2-NOTIF-05."
      - "Drilldown carries project/org/status filters to issue ledger."
  - id: "AC-P2-ISSUE-EXPORT-001"
    slice: "P2-ISSUE-06"
    name: "Issue analytics export remains a scoped client convenience export"
    assertions:
      - "Analytics read model is read-only."
      - "P2-EXPORT-001=B: browser-side PNG/download uses already-authorized analytics data and does not create ExportArtifact or ExportAuditEvent."
      - "Export button visibility still requires `PERM-P2-ISSUE-ANALYTICS-EXPORT`; branch actors without permission cannot trigger the client export UI."
  - id: "AC-P2-REVIEW-001"
    slice: "P2-REVIEW-07"
    name: "Unified review workbench respects assignment, levels, batch actions, and audit trail"
    assertions:
      - "Reviewer sees only assigned/project-scoped review tasks."
      - "Approve/reject/return decisions use L0/L1/L2/L3 level semantics restored by P2-REVIEW-LAYERS-001=B, with decision reason where applicable."
      - "Batch decisions apply atomically per eligible task and report per-task failures."
      - "Audit trail records actor, from/to level, decision, and comment."
  - id: "AC-P2-WORKFLOW-001"
    slice: "P2-WORKFLOW-01"
    name: "Workflow designer validates and publishes route templates"
    assertions:
      - "Draft template can define target scope, route chains, role/user approver selectors, and global final approver."
      - "Validation rejects unresolved roles/users, empty approver sets, disconnected chains, loops, missing final approver, target-scope ambiguity, and invalid typed conditions."
      - "Published template version is immutable and used by later scheduler/review tasks by snapshot."
      - "Route templates enforce segregation of duties so an L0 submitter cannot approve later levels for the same source record unless a future explicit override policy is approved."
  - id: "AC-P2-SCHED-001"
    slice: "P2-SCHED-02"
    name: "Assessment scheduler creates auditable scheduled dispatch executions"
    assertions:
      - "Schedule activation requires an active scheme and valid schedule rule."
      - "Predicted next fire time uses server-side calendar/timezone logic."
      - "Failed execution retry is idempotent or duplicate-protected."
      - "Scheduled dispatch reuses P1 dispatch guards."
  - id: "AC-P2-SIM-001"
    slice: "P2-SIM-03"
    name: "Simulation runs are non-mutating historical backtests"
    assertions:
      - "Simulation creates a run snapshot and never mutates official AssessmentResult."
      - "Missing historical data imputation is explicit in the result."
      - "Results can be refetched by simulationId with authorization."
  - id: "AC-P2-DATA-001"
    slice: "P2-DATA-04"
    name: "External data cockpit handles source health, retry, ignore, overwrite rerun, and audit export safely"
    assertions:
      - "Source health and sync job ledger are backed by real connector/job records or an approved sandbox adapter."
      - "Retry and overwrite rerun create audit events and enforce idempotency/duplicate controls."
      - "Ignore alert changes alert state without deleting failure evidence."
      - "Snapshot view redacts sensitive payload fields and references immutable evidence."
  - id: "AC-P2-PERMISSION-001"
    slice: "all"
    name: "P2 data-scope and permission denial"
    assertions:
      - "Branch actor cannot access HQ-only P2 issue analytics, workflow, scheduler, simulation, or data cockpit APIs."
      - "Out-of-scope review and notification records return 403 or 404 according to existing P0/P1 policy."
      - "Frontend menu/header visibility is never accepted as backend authorization."

quality_gates:
  contract_freeze:
    - "YAML parse for all P2 specs/contracts."
    - "T6 independent audit of P2 freeze candidate."
    - "T7 challenging review of hidden/orphan promotion, export semantics, workflow scope, and external data risk."
    - "Human decision P2-FREEZE-001 accepted before implementation."
    - "P2-WORKFLOW-OSS-001 accepted; P2-WORKFLOW-01/P2-REVIEW-07 must follow the lightweight route-template implementation guide."
  per_implementation_packet:
    - "verification report"
    - "backend tests for API/state/permission"
    - "frontend real-mode no silent fallback proof where UI is touched"
    - "expect-first browser evidence before Playwright promotion"
