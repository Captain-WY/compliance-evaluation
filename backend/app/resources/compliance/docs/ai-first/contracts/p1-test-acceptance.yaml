    expectation: "P1 E2E may visit P0 issue hub only for existing P0 core flows; project tracker tab must not be required."
  - id: "E2E-P1-NO-P2-MOCK-DEPENDENCY"
    excluded_scope: "AnalyticsDashboardTab / P2-ISSUE-06B and P2 assessment tools"
    expectation: "P1 E2E must not rely on P2 mock-only analytics/export surfaces."
