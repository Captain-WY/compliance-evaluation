    method: "GET"
    path: "/api/assessment/indicators"
    permission: "PERM-P1-ASSESSMENT-INDICATOR-READ"
    query: ["keyword", "categoryId", "businessLine", "status", "page", "pageSize"]
    response_entities: ["AssessmentIndicatorSummary"]
  - id: "P1-API-INDICATOR-CREATE"
    method: "POST"
    path: "/api/assessment/indicators"
    permission: "PERM-P1-ASSESSMENT-INDICATOR-MANAGE"
    request_entities: ["AssessmentIndicatorDraftCreate"]
    response_entities: ["AssessmentIndicatorDetail"]
  - id: "P1-API-INDICATOR-UPDATE-DRAFT"
    method: "PATCH"
    path: "/api/assessment/indicators/{indicatorId}/versions/{versionId}"
    permission: "PERM-P1-ASSESSMENT-INDICATOR-MANAGE"
    state_guard: "IndicatorVersion.status == DRAFT"
  - id: "P1-API-INDICATOR-VALIDATE-SCORING"
    method: "POST"
    path: "/api/assessment/indicators/{indicatorId}/versions/{versionId}/validate-scoring"
    permission: "PERM-P1-ASSESSMENT-INDICATOR-MANAGE"
    contract_refs:
      - "docs/ai-first/specs/p1-state-machines.yaml#scoring_formula_policy"
    security_policy:
      - "Backend evaluator must use a whitelisted expression parser."
      - "Backend evaluator must not use eval, new Function, Python exec/eval, dynamic import, or runtime code generation."
  - id: "P1-API-INDICATOR-PUBLISH"
    method: "POST"
    path: "/api/assessment/indicators/{indicatorId}/versions/{versionId}/publish"
    permission: "PERM-P1-ASSESSMENT-INDICATOR-MANAGE"
    state_guard: "DRAFT -> PUBLISHED"
  - id: "P1-API-INDICATOR-ARCHIVE"
    method: "POST"
    path: "/api/assessment/indicators/{indicatorId}/versions/{versionId}/archive"
    permission: "PERM-P1-ASSESSMENT-INDICATOR-MANAGE"
    state_guard: "DRAFT|PUBLISHED -> ARCHIVED"
    request_entities: ["ArchiveReasonRequest"]
  - id: "P1-API-INDICATOR-CLONE"
    method: "POST"
    path: "/api/assessment/indicators/{indicatorId}/versions/{versionId}/clone"
    permission: "PERM-P1-ASSESSMENT-INDICATOR-MANAGE"
