  - id: "P1-API-SCHEME-DETAIL"
    method: "GET"
    path: "/api/assessment/schemes/{schemeId}"
    permission: "PERM-P1-ASSESSMENT-SCHEME-READ"
    response_entities: ["AssessmentSchemeDetail"]
    errors: ["403 FORBIDDEN", "404 SCHEME_NOT_FOUND"]
  - id: "P1-API-SCHEME-VALIDATE-CREATE"
    method: "POST"
    path: "/api/assessment/schemes/validate"
    permission: "PERM-P1-ASSESSMENT-SCHEME-MANAGE"
    request_entities: ["AssessmentSchemeDraftCreatePreflightRequest"]
    response_entities: ["AssessmentSchemeValidationResult"]
    metadata_policy: "preflight only; idempotencyKey and optimisticVersion are not required"
    errors: ["403 FORBIDDEN", "422 VALIDATION_ERROR"]
  - id: "P1-API-SCHEME-VALIDATE-DRAFT"
    method: "POST"
    path: "/api/assessment/schemes/{schemeId}/validate"
    permission: "PERM-P1-ASSESSMENT-SCHEME-MANAGE"
    request_entities: ["AssessmentSchemeDraftValidateRequest"]
    response_entities: ["AssessmentSchemeValidationResult"]
    state_guard: "AssessmentScheme.status == DRAFT"
    metadata_policy: "requires optimisticVersion; does not require idempotencyKey because it is non-mutating"
    errors: ["403 FORBIDDEN", "404 SCHEME_NOT_FOUND", "409 INVALID_STATE", "409 VERSION_CONFLICT", "422 VALIDATION_ERROR"]
  - id: "P1-API-SCHEME-CREATE"
    method: "POST"
    path: "/api/assessment/schemes"
    permission: "PERM-P1-ASSESSMENT-SCHEME-MANAGE"
    request_entities: ["AssessmentSchemeDraftCreateRequest"]
    response_entities: ["AssessmentSchemeDetail"]
    metadata_policy: "requires idempotencyKey; optimisticVersion is not applicable for collection create"
    errors: ["403 FORBIDDEN", "409 DUPLICATE_SCHEME_CODE", "409 IDEMPOTENCY_KEY_CONFLICT", "422 VALIDATION_ERROR"]
  - id: "P1-API-SCHEME-UPDATE-DRAFT"
    method: "PATCH"
    path: "/api/assessment/schemes/{schemeId}"
    permission: "PERM-P1-ASSESSMENT-SCHEME-MANAGE"
    state_guard: "AssessmentScheme.status == DRAFT"
    request_entities: ["AssessmentSchemeDraftUpdateRequest"]
    response_entities: ["AssessmentSchemeDetail"]
    metadata_policy: "requires idempotencyKey and optimisticVersion"
    errors: ["403 FORBIDDEN", "404 SCHEME_NOT_FOUND", "409 INVALID_STATE", "409 VERSION_CONFLICT", "409 IDEMPOTENCY_KEY_CONFLICT", "422 VALIDATION_ERROR"]
  - id: "P1-API-SCHEME-PUBLISH"
    method: "POST"
    path: "/api/assessment/schemes/{schemeId}/publish"
    permission: "PERM-P1-ASSESSMENT-SCHEME-MANAGE"
    state_guard: "DRAFT -> ACTIVE"
    request_entities: ["AssessmentSchemeCommandRequest"]
    response_entities: ["AssessmentSchemeDetail"]
    metadata_policy: "requires idempotencyKey and optimisticVersion"
    errors: ["403 FORBIDDEN", "404 SCHEME_NOT_FOUND", "409 INVALID_TRANSITION", "409 VERSION_CONFLICT", "409 IDEMPOTENCY_KEY_CONFLICT", "422 VALIDATION_ERROR"]
  - id: "P1-API-SCHEME-COPY"
    method: "POST"
    path: "/api/assessment/schemes/{schemeId}/copy"
    permission: "PERM-P1-ASSESSMENT-SCHEME-MANAGE"
    request_entities: ["AssessmentSchemeCopyRequest"]
    response_entities: ["AssessmentSchemeDetail"]
    metadata_policy: "requires idempotencyKey and source optimisticVersion"
    state_guard: "source status != ARCHIVED; ACTIVE copy-to-draft is allowed with sourceTrace"
    errors: ["403 FORBIDDEN", "404 SCHEME_NOT_FOUND", "409 INVALID_STATE", "409 VERSION_CONFLICT", "409 IDEMPOTENCY_KEY_CONFLICT", "409 DUPLICATE_SCHEME_CODE", "422 VALIDATION_ERROR"]
  - id: "P1-API-SCHEME-DELETE-DRAFT"
    method: "DELETE"
    path: "/api/assessment/schemes/{schemeId}"
    permission: "PERM-P1-ASSESSMENT-SCHEME-MANAGE"
    state_guard: "delete only never-published DRAFT schemes"
    request_entities: ["AssessmentSchemeCommandRequest"]
    response_entities: ["AssessmentSchemeDeleteResult"]
    metadata_policy: "requires idempotencyKey and optimisticVersion"
    errors: ["403 FORBIDDEN", "404 SCHEME_NOT_FOUND", "409 INVALID_STATE", "409 VERSION_CONFLICT", "409 IDEMPOTENCY_KEY_CONFLICT", "422 VALIDATION_ERROR"]
  - id: "P1-API-SCHEME-ARCHIVE"
    method: "POST"
    path: "/api/assessment/schemes/{schemeId}/archive"
    permission: "PERM-P1-ASSESSMENT-SCHEME-MANAGE"
    state_guard: "DRAFT|SUSPENDED|EXPIRED -> ARCHIVED; ACTIVE -> ARCHIVED is rejected by default"
    request_entities: ["AssessmentSchemeArchiveRequest"]
    response_entities: ["AssessmentSchemeDetail"]
    metadata_policy: "requires reason, idempotencyKey, and optimisticVersion"
    errors: ["403 FORBIDDEN", "404 SCHEME_NOT_FOUND", "409 INVALID_TRANSITION", "409 VERSION_CONFLICT", "409 IDEMPOTENCY_KEY_CONFLICT", "422 VALIDATION_ERROR"]

