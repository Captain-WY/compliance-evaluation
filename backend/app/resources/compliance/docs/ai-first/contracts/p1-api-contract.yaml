    path: "/api/dashboard/branches/{orgId}/portrait"
    permission: "PERM-P1-DASHBOARD-BRANCH-PORTRAIT"
    read_model_only: true

scheme_command_metadata_contract:
  create_draft:
    dto: "AssessmentSchemeDraftCreateRequest"
    required: ["idempotencyKey"]
    not_applicable: ["optimisticVersion"]
    idempotency_scope: "SCHEME_COLLECTION + command + actorUserId + idempotencyKey"
  validate_create_preflight:
    dto: "AssessmentSchemeDraftCreatePreflightRequest"
    required: []
    note: "Non-mutating create preflight; no idempotencyKey or optimisticVersion required."
  validate_existing_draft_preflight:
    dto: "AssessmentSchemeDraftValidateRequest"
    required: ["optimisticVersion"]
    note: "Non-mutating existing-DRAFT preflight; idempotencyKey is intentionally not required."
  update_draft:
    dto: "AssessmentSchemeDraftUpdateRequest"
    required: ["idempotencyKey", "optimisticVersion"]
    state_guard: "DRAFT only"
  publish_scheme:
    dto: "AssessmentSchemeCommandRequest"
    required: ["idempotencyKey", "optimisticVersion"]
    state_guard: "DRAFT -> ACTIVE"
  copy_scheme_to_draft:
    dto: "AssessmentSchemeCopyRequest"
    required: ["idempotencyKey", "optimisticVersion"]
    state_guard: "source status != ARCHIVED; ACTIVE source is copied into a new DRAFT with sourceTrace"
  delete_draft:
    dto: "AssessmentSchemeCommandRequest"
    required: ["idempotencyKey", "optimisticVersion"]
    state_guard: "DRAFT and hasBeenPublished == false"
  archive_scheme:
    dto: "AssessmentSchemeArchiveRequest"
    required: ["reason", "idempotencyKey", "optimisticVersion"]
    state_guard: "DRAFT|SUSPENDED|EXPIRED -> ARCHIVED; ACTIVE -> ARCHIVED remains unsupported"
  deterministic_error_codes:
    missing_or_invalid_metadata: "422 VALIDATION_ERROR or 422 COMMAND_METADATA_REQUIRED / COMMAND_METADATA_INVALID"
    stale_optimistic_version: "409 VERSION_CONFLICT"
    idempotency_payload_conflict: "409 IDEMPOTENCY_KEY_CONFLICT"
    invalid_state_or_transition: "409 INVALID_STATE / INVALID_TRANSITION"

deferred_api_groups:
  - "P2 workflow route designer"
  - "P2 scheduler runtime"
  - "P2 simulation cockpit"
  - "P2 external data collection/retry/export"
  - "P2 notification read receipts"
  - "P2 issue project tracker read model and overdue reminder command"
  - "P2 issue analytics dashboard and PNG export"
  - "P2 cycle cancellation command after source-backed action/test/audit semantics are defined"

